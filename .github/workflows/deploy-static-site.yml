name: Deploy static site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-static-site.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.ref }}-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      url: ${{ steps.deploy.outputs.site_url }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_KEY: multi-env-aws-terraform/${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}/terraform.tfstate
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: site-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read site target from Terraform state
        id: target
        shell: bash
        run: |
          terraform -chdir="environments/${DEPLOY_ENV}" init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          echo "bucket=$(terraform -chdir="environments/${DEPLOY_ENV}" output -raw static_site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform -chdir="environments/${DEPLOY_ENV}" output -raw static_site_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform -chdir="environments/${DEPLOY_ENV}" output -raw static_site_url)" >> "$GITHUB_OUTPUT"
      - name: Upload site and clear CloudFront cache
        id: deploy
        shell: bash
        env:
          SITE_BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.target.outputs.distribution_id }}
          SITE_URL: ${{ steps.target.outputs.site_url }}
        run: |
          site_dir="${RUNNER_TEMP}/static-site"
          mkdir -p "$site_dir"
          cp -R site/. "$site_dir/"
          sed "s/__ENVIRONMENT__/${DEPLOY_ENV}/g" site/index.html > "$site_dir/index.html"
          aws s3 sync "$site_dir/" "s3://${SITE_BUCKET}/" --delete --cache-control "public,max-age=60"
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${DEPLOY_ENV} site: ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
